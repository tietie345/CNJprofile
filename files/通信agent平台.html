<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoEvolve EE｜最终版完整产品原型</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #f8fbff;
      --ink: #162033;
      --muted: #6d7890;
      --line: #e2eaf4;
      --line-2: #d2ddec;
      --blue: #2357d6;
      --blue-2: #123fae;
      --blue-soft: #edf3ff;
      --green: #14966a;
      --green-soft: #eaf8f2;
      --amber: #c97913;
      --amber-soft: #fff5df;
      --red: #d73d3d;
      --red-soft: #fff0f0;
      --purple: #7355d6;
      --purple-soft: #f3efff;
      --cyan: #0b829d;
      --cyan-soft: #e8f8fb;
      --navy: #0f1b31;
      --shadow: 0 18px 50px rgba(22, 34, 62, .09);
      --shadow-soft: 0 8px 24px rgba(22, 34, 62, .07);
      --radius-xl: 22px;
      --radius: 16px;
      --radius-sm: 12px;
      --top-h: 64px;
      --side-w: 252px;
      --right-w: 360px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: radial-gradient(circle at top left, #eaf1ff 0, #f4f7fb 36%, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    button, input, select, textarea { font: inherit; }

    .app { height: 100vh; display: grid; grid-template-rows: var(--top-h) 1fr; min-width: 1220px; }
    .topbar {
      height: var(--top-h);
      background: rgba(255,255,255,.93);
      border-bottom: 1px solid rgba(224,232,245,.96);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 200px; }
    .logo {
      width: 34px; height: 34px; border-radius: 12px;
      background: linear-gradient(145deg, #183b85, #2357d6);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; box-shadow: 0 8px 18px rgba(35,87,214,.25);
    }
    .brand h1 { margin: 0; font-size: 15px; line-height: 1.1; }
    .brand span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
    .context-bar { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ctx {
      height: 36px; border: 1px solid var(--line); background: var(--surface-2);
      border-radius: 999px; padding: 0 11px; display: flex; align-items: center; gap: 7px;
      color: #3f4b61; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .ctx b { color: var(--ink); font-weight: 720; }
    .global-search {
      flex: 1; max-width: 460px; min-width: 250px; height: 38px;
      border: 1px solid var(--line); border-radius: 999px; background: #fff;
      display: flex; align-items: center; gap: 8px; padding: 0 13px;
      color: var(--muted); font-size: 12px;
    }
    .global-search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: #49566d; position: relative; transition: .16s ease;
    }
    .icon-btn:hover { box-shadow: var(--shadow-soft); transform: translateY(-1px); }
    .badge-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
    .user-mini {
      height: 38px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
      display: flex; align-items: center; gap: 9px; padding: 3px 9px 3px 4px; cursor: pointer;
    }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
    .user-mini span { font-size: 12px; color: #3c475b; }

    .layout { min-height: 0; display: grid; grid-template-columns: var(--side-w) minmax(0,1fr); padding: 14px; gap: 14px; overflow: hidden; }
    .sidebar { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
    .role-summary { background: linear-gradient(145deg, #101a30 0%, #142a56 100%); color: #fff; border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow); }
    .role-summary .role { font-size: 12px; color: #bcd0ef; margin-bottom: 7px; }
    .role-summary h2 { font-size: 18px; margin: 0; line-height: 1.25; }
    .role-summary p { margin: 8px 0 0; font-size: 12px; line-height: 1.55; color: #c8d5e9; }
    .role-summary .mini-switch { margin-top: 12px; display: flex; gap: 7px; flex-wrap: wrap; }

    .panel, .card {
      border: 1px solid rgba(224,232,245,.95); background: rgba(255,255,255,.96);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); overflow: hidden;
    }
    .card { padding: 15px; }
    .card.flat { box-shadow: none; background: #fff; border-radius: var(--radius); }
    .nav-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .nav-head { padding: 13px 14px 9px; border-bottom: 1px solid var(--line); }
    .nav-head h3 { margin: 0; font-size: 14px; }
    .nav-head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); line-height: 1.4; }
    .nav-list { padding: 9px; overflow: auto; }
    .nav-group-title { margin: 10px 7px 6px; font-size: 11px; color: #8590a4; }
    .nav-btn {
      width: 100%; border: 0; background: transparent; border-radius: 13px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px; color: #445066; font-size: 13px; cursor: pointer; transition: .16s ease; margin-bottom: 4px; text-align: left;
    }
    .nav-btn:hover { background: #f3f6fb; }
    .nav-btn.active { background: var(--blue-soft); color: var(--blue); font-weight: 750; }
    .nav-btn .left { display: flex; align-items: center; gap: 9px; }
    .nav-icon { width: 22px; height: 22px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: #f1f5fa; color: #647188; font-size: 12px; }
    .nav-btn.active .nav-icon { background: #dce7ff; color: var(--blue); }
    .nav-count { font-size: 11px; color: var(--muted); }

    .main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
    .page-head {
      background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft);
      padding: 15px 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    }
    .crumb { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .page-title { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.2px; }
    .page-sub { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .content { min-height: 0; overflow: auto; padding-right: 2px; }
    .page { display: none; }
    .page.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }

    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .grid-4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .split { display: grid; grid-template-columns: minmax(0,1fr) var(--right-w); gap: 12px; }
    .split-wide { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 12px; }
    .three-col { display: grid; grid-template-columns: 300px minmax(0,1fr) 360px; gap: 12px; }

    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .card h3 { margin: 0; font-size: 15px; line-height: 1.35; }
    .card h4 { margin: 0; font-size: 13px; line-height: 1.35; }
    .card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .metric { min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 28px; font-weight: 850; letter-spacing: -.5px; }
    .metric .foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 5px 8px; font-size: 11px; line-height: 1; background: #f1f5fa; color: #526075; border: 1px solid var(--line); white-space: nowrap; }
    .tag.blue { background: var(--blue-soft); color: var(--blue); border-color: #cfdcff; }
    .tag.green { background: var(--green-soft); color: var(--green); border-color: #b9e7d2; }
    .tag.amber { background: var(--amber-soft); color: #a66204; border-color: #efd29b; }
    .tag.red { background: var(--red-soft); color: var(--red); border-color: #ffc8c8; }
    .tag.purple { background: var(--purple-soft); color: var(--purple); border-color: #ded3ff; }
    .tag.cyan { background: var(--cyan-soft); color: var(--cyan); border-color: #b9e7ef; }
    .tag.dark { background: rgba(255,255,255,.1); color: #e8eefb; border-color: rgba(255,255,255,.18); }

    .btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink); border-radius: 12px; padding: 9px 11px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; transition: .16s ease; font-size: 12px; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    .btn.blue { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.blue:hover { background: var(--blue-2); }
    .btn.red { background: var(--red-soft); color: var(--red); border-color: #ffc8c8; }
    .btn.ghost { background: transparent; box-shadow: none; }
    .btn.small { padding: 6px 8px; border-radius: 10px; font-size: 11px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); margin-bottom: 12px; }
    .toolbar input, .toolbar select { height: 34px; border: 1px solid var(--line-2); border-radius: 11px; padding: 0 10px; background: #fff; font-size: 12px; color: var(--ink); outline: none; }
    .toolbar input { min-width: 220px; }

    .work-item { border: 1px solid var(--line); border-radius: 17px; background: #fff; padding: 13px; margin-bottom: 10px; transition: .16s ease; cursor: pointer; }
    .work-item:hover { transform: translateY(-1px); border-color: #c5d3e7; box-shadow: var(--shadow-soft); }
    .work-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .work-title { margin: 0; font-size: 13px; line-height: 1.35; }
    .work-desc { margin: 6px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .work-meta { display: flex; flex-wrap: wrap; gap: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: #5d687a; background: #f8fbff; font-weight: 750; position: sticky; top: 0; z-index: 1; }
    tr:hover td { background: #fbfdff; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }

    .flow-track { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0; }
    .step { display: flex; align-items: center; gap: 7px; min-width: 118px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .step::after { content:""; height: 1px; background: var(--line-2); flex: 1; min-width: 18px; }
    .step:last-child::after { display:none; }
    .step-dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-2); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; flex: 0 0 auto; }
    .step.done { color: var(--green); }
    .step.done .step-dot { background: var(--green); color: #fff; border-color: var(--green); }
    .step.active { color: var(--blue); font-weight: 750; }
    .step.active .step-dot { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 0 5px var(--blue-soft); }
    .step.blocked { color: var(--red); font-weight: 750; }
    .step.blocked .step-dot { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 0 5px var(--red-soft); }

    .graph { overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: linear-gradient(180deg,#fff 0%,#f8fbff 100%); }
    .graph-grid { display: grid; grid-template-columns: repeat(6,minmax(130px,1fr)); gap: 10px; min-width: 870px; }
    .graph-col { display: flex; flex-direction: column; gap: 9px; }
    .graph-title { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 2px; }
    .node { border: 1px solid var(--line); border-radius: 15px; padding: 11px; min-height: 92px; background: #fff; cursor: pointer; position: relative; transition: .16s ease; }
    .node:hover { transform: translateY(-1px); border-color: #b7c6df; box-shadow: var(--shadow-soft); }
    .node::before { content:""; position: absolute; right: 10px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .node h5 { margin: 0 0 6px; font-size: 12px; }
    .node p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .node.ok { background:#f3fbf7; border-color:#aee0c9; }
    .node.ok::before { background:var(--green); }
    .node.warn { background:#fff9ee; border-color:#efcc86; }
    .node.warn::before { background:var(--amber); }
    .node.bad { background:#fff4f4; border-color:#ffb9b9; }
    .node.bad::before { background:var(--red); }
    .node.ai { background:#f5f7ff; border-color:#bdccff; }
    .node.ai::before { background:var(--blue); }

    .agent-box { border: 1px solid #1f2c45; background: linear-gradient(180deg,#101827,#111f36); color: #e5e7eb; border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow); }
    .agent-head { padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .agent-head h3 { margin: 0; font-size: 15px; }
    .agent-head p { margin: 5px 0 0; color: #9ca9bf; font-size: 12px; line-height: 1.45; }
    .agent-body { padding: 13px; display: flex; flex-direction: column; gap: 10px; }
    .agent-step { display: grid; grid-template-columns: 24px 1fr auto; gap: 9px; align-items: start; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .agent-step:last-child { border-bottom: 0; }
    .agent-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #24314d; border: 1px solid #344363; color: #93c5fd; font-size: 10px; font-weight: 800; }
    .agent-step.done .agent-dot { background:#065f46; border-color:#047857; color:#a7f3d0; }
    .agent-step.active .agent-dot { background:#1d4ed8; border-color:#3b82f6; color:#bfdbfe; }
    .agent-step.block .agent-dot { background:#7f1d1d; border-color:#dc2626; color:#fecaca; }
    .agent-step b { display:block; color:#e5e7eb; font-size:12px; }
    .agent-step span { display:block; color:#9ca3af; margin-top:3px; font-size:11px; line-height:1.4; }

    .evidence-list { display: flex; flex-direction: column; gap: 8px; }
    .evidence-card { display: grid; grid-template-columns: 28px 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-2); padding: 10px; }
    .ev-num { width: 26px; height: 26px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--blue-soft); color: var(--blue); font-weight: 850; font-size: 11px; }
    .evidence-card h4 { margin: 0 0 4px; font-size: 12px; }
    .evidence-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }

    .form { display:grid; gap:10px; }
    label { display:grid; gap:6px; color:#445066; font-weight:720; font-size:12px; }
    input, select, textarea { width:100%; border:1px solid var(--line-2); border-radius:13px; padding:10px 11px; background:#fff; color:var(--ink); outline:none; }
    textarea { min-height:96px; resize:vertical; }
    input:focus, select:focus, textarea:focus { border-color:#98adf6; box-shadow:0 0 0 3px rgba(35,87,214,.12); }

    .tabs { display:flex; gap:7px; padding:5px; background:#edf2f8; border-radius:999px; width:max-content; margin-bottom: 12px; }
    .tab { border:0; background:transparent; border-radius:999px; padding:7px 10px; font-size:12px; color:#647188; cursor:pointer; }
    .tab.active { background:#fff; color:var(--blue); box-shadow:var(--shadow-soft); font-weight:750; }

    .comment-box { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: var(--surface-2); }
    .comment { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .comment:last-child { border-bottom: 0; }
    .comment b { font-size: 12px; }
    .comment p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }

    .modal-backdrop { position: fixed; inset:0; background:rgba(15,23,42,.38); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000; }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(920px,100%); max-height:86vh; overflow:auto; background:#fff; border-radius:24px; box-shadow:0 30px 100px rgba(15,23,42,.32); border:1px solid var(--line); }
    .modal-head { padding:16px 18px; display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
    .modal-head h3 { margin:0; font-size:16px; }
    .modal-body { padding:18px; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(16px); background:#111827; color:#fff; border-radius:999px; padding:11px 16px; box-shadow:0 18px 50px rgba(17,24,39,.28); opacity:0; pointer-events:none; transition:.22s ease; z-index:9999; font-size:13px; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo">AE</div><div><h1>AutoEvolve EE</h1><span>数字主线与 Agentic Workflow</span></div></div>
      <div class="context-bar">
        <div class="ctx">项目 <b>X01 平台</b> ⌄</div><div class="ctx">车型 <b>X01 高配 Pro</b> ⌄</div><div class="ctx">基线 <b>BL-2026.04</b> ⌄</div><div class="ctx">阶段 <b>架构冻结</b> ⌄</div>
        <div class="global-search">⌕ <input placeholder="搜索需求 / Function / 接口 / DTC / Issue / 证据" onkeydown="if(event.key==='Enter')openModal('全局搜索结果', searchResult())" /></div>
      </div>
      <div class="top-actions"><button class="icon-btn" onclick="openModal('通知中心', notificationCenter())">🔔<span class="badge-dot"></span></button><button class="icon-btn" onclick="openModal('最近访问', recentView())">🕘</button><button class="icon-btn" onclick="toast('打开帮助文档')">?</button><div class="user-mini" onclick="openRoleMenu()"><div class="avatar" id="userAvatar">通</div><span id="userText">张工｜通信工程师</span>⌄</div></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <section class="role-summary"><div class="role">当前岗位工作台</div><h2 id="roleTitle">通信工程师</h2><p id="roleDesc">处理接口影响确认、Service / Signal 变更、通信 Issue 与软件协同请求。</p><div class="mini-switch" id="roleQuick"></div></section>
        <section class="panel nav-panel"><div class="nav-head"><h3>工作域导航</h3><p id="navHint">根据当前岗位显示高频页面。</p></div><nav class="nav-list" id="navList"></nav></section>
      </aside>
      <main class="main">
        <section class="page-head"><div><div class="crumb" id="crumb">我的工作台 / 通信工程师</div><h2 class="page-title" id="pageTitle">我的工作台</h2><p class="page-sub" id="pageSub">今天需要处理的专业确认任务、通信 Issue、协同请求和 Gate 阻断。</p></div><div class="page-actions" id="pageActions"></div></section>
        <section class="content">
          <div id="page-workbench" class="page active"></div><div id="page-confirmation" class="page"></div><div id="page-impact" class="page"></div><div id="page-function" class="page"></div><div id="page-issue" class="page"></div><div id="page-gate" class="page"></div><div id="page-import" class="page"></div><div id="page-agent" class="page"></div><div id="page-object" class="page"></div>
        </section>
      </main>
    </div>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3 id="modalTitle">详情</h3><button class="btn small" onclick="hideModal()">关闭</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <div class="toast" id="toast"></div>

  <script>
    const roles = {

    function renderHead(){const [title,sub]=pageMeta[currentPage];crumb.textContent=`${roles[currentRole].title} / ${title}`;pageTitle.textContent=title;pageSub.textContent=sub;const a={workbench:[['处理下一个任务','blue','switchPage("confirmation")'],['批量处理','','openModal("批量处理", batchActions())'],['导出我的任务','','toast("已生成个人任务清单")']],confirmation:[['确认受影响','blue','confirmAffected()'],['转 Issue','red','switchPage("issue")'],['要求补证据','','openEvidence("补充证据")']],impact:[['生成确认任务','blue','toast("已生成 5 个 Confirmation Task")'],['重新分析','','toast("Change Impact Agent 已重新执行")']],function:[['运行链路诊断','blue','toast("Trace Agent 已完成诊断")'],['创建确认任务','','switchPage("confirmation")']],issue:[['提交修复证据','blue','openFixModal()'],['请求复核','','toast("已请求通信与测试复核")'],['尝试关闭','','toast("证据不足，不能关闭")']],gate:[['重新预检查','blue','toast("Gate 预检查已重新执行")'],['生成整改看板','','toast("已生成整改看板")'],['生成评审包','','toast("当前只能生成内部整改版草稿")']],import:[['运行解析','blue','toast("导入解析完成，生成 2486 个候选对象")'],['进入候选确认','','switchPage("confirmation")']],agent:[['查看证据','blue','openEvidence("Agent Run")'],['记录采纳反馈','','toast("已记录采纳反馈")']],object:[['新建对象关系','blue','toast("已创建候选关系，等待确认")'],['查看版本','','openModal("版本历史", versionHistory())']] }[currentPage];pageActions.innerHTML=a.map(x=>`<button class="btn ${x[1]}" onclick='${x[2]}'>${x[0]}</button>`).join('');}
    function renderPages(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+currentPage).classList.add('active');document.getElementById('page-workbench').innerHTML=pageWorkbench();document.getElementById('page-confirmation').innerHTML=pageConfirmation();document.getElementById('page-impact').innerHTML=pageImpact();document.getElementById('page-function').innerHTML=pageFunction();document.getElementById('page-issue').innerHTML=pageIssue();document.getElementById('page-gate').innerHTML=pageGate();document.getElementById('page-import').innerHTML=pageImport();document.getElementById('page-agent').innerHTML=pageAgent();document.getElementById('page-object').innerHTML=pageObject();}

    function pageWorkbench(){const roleCards={comm:[['待确认通信影响','5','SVC-021、SIG-088 等接口对象需要确认','amber'],['通信 Issue','4','2 个阻断 Gate，1 个等待软件复核','red'],['软件协同请求','3','SWC-017 接口实现状态待确认','blue'],['Gate 通信阻断','2','架构冻结 Gate 尚未满足通信条件','red']],arch:[['Function 断链','6','FN-034 等功能存在下游承接缺口','red'],['Agent 推荐关系','8','需求到 Function 推荐关系待确认','blue'],['架构确认任务','3','来自 CR-004 和 FN-034 健康检查','amber'],['架构 Issue','3','异常路径与接口承接问题','red']],pm:[['Gate 阻断项','7','通信、软件、测试、安全均有阻断','red'],['待确认专业','12','5 个专业尚未完成确认','amber'],['超期 Issue','3','影响架构冻结评审准备','red'],['高风险变更','4','CR-004 影响范围最大','blue']],test:[['测试影响确认','7','变更回归范围待确认','amber'],['覆盖缺口','6','异常路径和诊断测试不足','red'],['待复测 Issue','5','软件修复后需复测','red'],['推荐用例草稿','12','Agent 生成待采纳','blue']],data:[['导入任务','3','X01 架构资料包解析中','blue'],['字段映射待确认','17','通信矩阵存在字段冲突','amber'],['低置信度对象','34','需分发给专业确认','red'],['导入质量','88%','可入库对象 2164 个','green']]}[currentRole];return `<div class="grid grid-4">${roleCards.map(c=>metric(c)).join('')}</div><div class="split" style="margin-top:12px"><section class="card"><div class="card-head"><div><h3>我的优先处理队列</h3><p>按阻断影响、截止时间、依赖关系排序；支持筛选和批量处理。</p></div><span class="tag blue">个人工作流</span></div>${toolbar(['全部','待确认','阻断','超期'])}${tasks.map(t=>workItem(t.title,t.desc,t.status,t.color,'switchPage("confirmation")',t)).join('')}</section><aside class="card"><div class="card-head"><div><h3>本周工作负载</h3><p>让个体工程师看到自己的节奏，而不是只服务管理看板。</p></div></div>${loadPanel()}<div style="margin-top:12px"><h3>最近 Agent 建议</h3>${agentMini('Change Impact Agent','CR-004 影响 18 个对象，建议生成 5 个确认任务。')}${agentMini('Trace Agent','FN-034 存在 3 条断链，2 条 Agent 推荐关系。')}${agentMini('Gate Review Agent','当前 7 个阻断项，暂不具备提交评审条件。')}</div></aside></div>`;}

    function pageConfirmation(){const selected=tasks.find(t=>t.id===selectedTask)||tasks[0];return `<div class="three-col"><section class="card"><div class="card-head"><div><h3>确认任务队列</h3><p>每个任务都能追溯来源、对象、证据、责任和流转。</p></div></div>${toolbar(['全部','我的','阻断','待补证据'])}${tasks.map(t=>workItem(t.title,t.desc,t.status,t.color,`selectedTask='${t.id}';renderAll()`,t)).join('')}</section><section class="card"><div class="card-head"><div><h3>${selected.title}</h3><p>主对象：Confirmation Task。工程师拥有确认、驳回、补证据、转 Issue 的专业决策权。</p></div><span class="tag ${selected.color}">${selected.status}</span></div>${flowTrack([['任务生成','done'],['查看证据','active'],['专业确认','active'],['必要时转 Issue',''],['关闭任务','']])}<div class="grid grid-2" style="margin-top:12px">${infoCard('为什么找我？','CR-004 新增失败原因返回，FN-034 依赖 RemoteControlService，Agent 判断通信接口字段可能变化。')}${infoCard('我需要确认什么？','SVC-021 是否需要新增 retryStatus / failReason；Provider / Consumer 是否需要同步。')}${infoCard('确认后的流转','不受影响则关闭任务；受影响但无需整改则记录意见；需要整改则转 Issue Candidate。')}${infoCard('对 Gate 的影响','未确认时阻断“接口影响必须完成专业确认”条件。')}</div><div class="comment-box" style="margin-top:12px"><h4>专业意见</h4><textarea placeholder="填写确认意见、前提条件或风险说明……">建议新增 retryStatus 字段，并同步 Consumer 侧错误码枚举；需要软件负责人确认 SWC-017 是否承接 v2。</textarea></div><div class="btn-row" style="margin-top:12px"><button class="btn blue" onclick="confirmAffected()">确认受影响</button><button class="btn" onclick="toast('已确认不受影响，任务关闭')">确认不受影响</button><button class="btn" onclick="openEvidence('补充证据')">要求补证据</button><button class="btn" onclick="toast('已转软件负责人确认')">转其他专业</button><button class="btn red" onclick="switchPage('issue')">转 Issue</button></div></section><aside class="card"><div class="card-head"><div><h3>证据链与历史</h3><p>避免工程师翻文档、追会议纪要。</p></div></div>${evidenceChain()}<div style="margin-top:12px">${historyBox()}</div></aside></div>`;}

    function pageImpact(){return `<div class="split"><section class="card"><div class="card-head"><div><h3>CR-004：远程控制启动失败反馈变更</h3><p>变更影响分析页必须完整展示：差异、路径、对象、确认任务、Issue 候选、Gate 影响。</p></div><span class="tag red">3 个阻断候选</span></div><div class="grid grid-2"><div class="card flat"><h4>旧需求</h4><p>远程控制启动失败时，系统返回失败状态。</p></div><div class="card flat"><h4>新需求</h4><p>失败时 3 秒内返回失败原因；连续 3 次失败后进入保护状态，并记录诊断事件。</p></div></div><div style="margin-top:12px">${flowTrack([['变更提交','done'],['Agent 分析','done'],['生成确认任务','active'],['专业确认','active'],['Issue 整改',''],['Gate 更新','']])}</div><div class="graph" style="margin-top:12px">${impactGraph()}</div><div class="grid grid-3" style="margin-top:12px">${taskCard('通信确认任务','SVC-021 字段变化待确认。','通信工程师','待确认','amber')}${taskCard('软件承接任务','SWC-017 接口版本未同步。','软件负责人','阻断','red')}${taskCard('测试覆盖任务','异常路径测试缺失。','测试负责人','阻断','red')}</div></section><aside>${agentBox('Change Impact Agent',[['解析需求差异','识别失败原因返回、保护状态、诊断事件。','done'],['定位 Function','命中 FN-034 远程控制启动。','done'],['展开影响路径','Interface / DTC / SWC / Test 均受影响。','done'],['生成确认任务','建议生成 5 个 Confirmation Task。','active']],[['生成确认任务','blue','toast("已生成 5 个专业确认任务")'],['查看证据','','openEvidence("CR-004")']])}<div class="card" style="margin-top:12px"><h3>专业确认进度</h3>${progressRow('通信',60,'amber')}${progressRow('软件',30,'red')}${progressRow('测试',20,'red')}${progressRow('诊断',70,'amber')}${progressRow('安全',10,'red')}</div></aside></div>`;}

    function versionHistory(){return `<div class="table-wrap"><table><thead><tr><th>版本</th><th>时间</th><th>变更</th><th>操作者</th></tr></thead><tbody><tr><td>v2 candidate</td><td>2026-05-09</td><td>新增 retryStatus / failReason</td><td>Change Impact Agent</td></tr><tr><td>v1 frozen</td><td>2026-04-18</td><td>架构冻结前版本</td><td>张工</td></tr></tbody></table></div>`;}
    function batchActions(){return `<div class="grid grid-2"><div class="card flat"><h3>批量确认不受影响</h3><p>仅适用于证据完整且低风险任务。</p><button class="btn blue" onclick="toast('已批量处理低风险任务');hideModal();">执行</button></div><div class="card flat"><h3>批量要求补证据</h3><p>对证据缺口任务统一退回。</p><button class="btn" onclick="toast('已批量要求补充证据');hideModal();">执行</button></div></div>`;}
    function openRoleMenu(){openModal('演示视角切换',`<p style="margin-top:0;color:var(--muted);font-size:13px;line-height:1.6">真实产品里角色由账号权限决定，这里仅作为原型演示入口。</p><div class="grid grid-2">${Object.entries(roles).map(([id,r])=>`<div class="work-item" onclick="switchRole('${id}');hideModal();"><div class="work-top"><h4 class="work-title">${r.title}</h4><span class="tag blue">演示</span></div><p class="work-desc">${r.desc}</p></div>`).join('')}</div>`);}
    function confirmAffected(){toast('已确认受影响：将生成 Issue 候选并通知软件负责人');}
    function openEvidence(id){openModal('证据链｜'+id,evidenceChain()+`<div class="btn-row" style="margin-top:14px"><button class="btn blue" onclick="toast('已确认证据');hideModal();">确认证据</button><button class="btn" onclick="toast('已要求补充证据');hideModal();">要求补充</button></div>`);}
    function openFixModal(){openModal('提交修复证据',`<div class="form"><label>修复说明<textarea>SWC-017 已升级至接口 v2，新增 retryStatus / failReason 字段。</textarea></label><label>复核人<select><option>通信工程师</option><option>测试负责人</option></select></label><label>附件/证据<input value="SWC-017_interface_v2_diff.xlsx" /></label><div class="btn-row"><button class="btn blue" onclick="toast('修复证据已提交，进入复核');hideModal();">提交</button></div></div>`);}
    function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modalBackdrop.classList.add('show');}
    function hideModal(){modalBackdrop.classList.remove('show');}
    function closeModal(e){if(e.target.id==='modalBackdrop')hideModal();}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
    renderAll();
  </script>
</body>
</html>
